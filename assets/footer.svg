<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Matching Header -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="35%" stop-color="#0b101d"/>
      <stop offset="70%" stop-color="#120914"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <!-- Spider Red to Electric Blue Gradient -->
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="45%" stop-color="#E62429"/>
      <stop offset="75%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <radialGradient id="footerCenterGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#00D2FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scalloped Spider-Web Top Arch ClipPath -->
    <clipPath id="spiderFooterClip">
      <path d="M 0 45 Q 110 65, 190 18 Q 295 55, 390 12 Q 490 50, 585 22 Q 690 52, 810 10 Q 930 48, 1020 20 Q 1115 60, 1200 40 L 1200 140 L 0 140 Z"/>
    </clipPath>
  </defs>

  <!-- Base Canvas Clipped into Inverted Spider-Web Canopy -->
  <g clip-path="url(#spiderFooterClip)">
    <rect width="1200" height="140" fill="url(#footerBg)"/>
    <rect width="1200" height="140" fill="url(#footerCenterGlow)"/>

    <!-- Subtle Matrix Grid -->
    <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.8">
      <line x1="0" y1="50" x2="1200" y2="50"/>
      <line x1="0" y1="90" x2="1200" y2="90"/>
      <line x1="200" y1="0" x2="200" y2="140"/>
      <line x1="400" y1="0" x2="400" y2="140"/>
      <line x1="600" y1="0" x2="600" y2="140"/>
      <line x1="800" y1="0" x2="800" y2="140"/>
      <line x1="1000" y1="0" x2="1000" y2="140"/>
    </g>

    <!-- Radiating Spider-Web Spokes Extending Downwards into the Canvas -->
    <line x1="190" y1="18" x2="220" y2="140" stroke="#FF1744" stroke-width="0.8" opacity="0.25"/>
    <line x1="390" y1="12" x2="430" y2="140" stroke="#FF2A4D" stroke-width="0.7" opacity="0.2"/>
    <line x1="585" y1="22" x2="585" y2="70" stroke="url(#spiderGlow)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.3"/>
    <line x1="810" y1="10" x2="770" y2="140" stroke="#00D2FF" stroke-width="0.7" opacity="0.2"/>
    <line x1="1020" y1="20" x2="980" y2="140" stroke="#00E5FF" stroke-width="0.8" opacity="0.25"/>
  </g>

  <!-- Thin & Subtle Scalloped Spider-Web Top Arch (Mirroring the Header) -->
  <path d="M 0 45 Q 110 65, 190 18 Q 295 55, 390 12 Q 490 50, 585 22 Q 690 52, 810 10 Q 930 48, 1020 20 Q 1115 60, 1200 40" stroke="url(#spiderGlow)" stroke-width="1.2" fill="none" opacity="0.8"/>

  <!-- Subtle Anchor Nodes on Top Scallops -->
  <circle cx="190" cy="18" r="2.8" fill="#FF1744" filter="url(#glowRed)"/>
  <circle cx="390" cy="12" r="2.5" fill="#FF2A4D"/>
  <circle cx="585" cy="22" r="3.2" fill="#FFFFFF" filter="url(#glowCyan)"/>
  <circle cx="810" cy="10" r="2.5" fill="#00D2FF"/>
  <circle cx="1020" cy="20" r="2.8" fill="#00E5FF" filter="url(#glowCyan)"/>

  <!-- Center Stylized Spider Crest & Signature -->
  <g transform="translate(600, 85)">
    <!-- Mini Spider Emblem -->
    <path d="M 0 -14 L 4 -6 L 2 2 L 0 5 L -2 2 L -4 -6 Z" fill="#FF1744" filter="url(#glowRed)"/>
    <path d="M 0 7 L 5 14 L 4 22 L 0 28 L -4 22 L -5 14 Z" fill="#FF1744" filter="url(#glowRed)"/>
    <circle cx="0" cy="2" r="1.5" fill="#00E5FF"/>

    <!-- Left Legs -->
    <path d="M -3 -6 L -10 -15 L -20 -18" fill="none" stroke="#FF1744" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M -4 -2 L -14 -6 L -24 -6" fill="none" stroke="#FF2A4D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M -4 9 L -14 12 L -22 18" fill="none" stroke="#00D2FF" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M -3 16 L -10 24 L -18 34" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Right Legs -->
    <path d="M 3 -6 L 10 -15 L 20 -18" fill="none" stroke="#FF1744" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 4 -2 L 14 -6 L 24 -6" fill="none" stroke="#FF2A4D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 4 9 L 14 12 L 22 18" fill="none" stroke="#00D2FF" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 3 16 L 10 24 L 18 34" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Tagline Quote -->
  <text x="600" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="2.5" text-anchor="middle">
    WITH GREAT CODE COMES GREAT RELIABILITY
  </text>

  <!-- Bottom Accent Bar -->
  <line x1="0" y1="138" x2="1200" y2="138" stroke="url(#spiderGlow)" stroke-width="1.2" opacity="0.6"/>
</svg>
