<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="35%" stop-color="#0b101d"/>
      <stop offset="70%" stop-color="#120914"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <!-- Spider Red to Electric Blue Gradient -->
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="45%" stop-color="#E62429"/>
      <stop offset="75%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D"/>
      <stop offset="100%" stop-color="#B7092B"/>
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <radialGradient id="centerLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#0066FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlowRed" cx="0%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlowBlue" cx="100%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseWeb {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.32; }
    }
    @keyframes floatSpider {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .web-lines { animation: pulseWeb 6s ease-in-out infinite; }
    .spider-icon { animation: floatSpider 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#centerLight)"/>
  <rect width="1200" height="380" fill="url(#cornerGlowRed)"/>
  <rect width="1200" height="380" fill="url(#cornerGlowBlue)"/>

  <!-- High-Tech Matrix / Cyber Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Left Geometric Spider-Web Network (Red Tone) -->
  <g class="web-lines" stroke="#FF1744" stroke-width="1.2" fill="none">
    <path d="M 0 0 L 220 80 L 160 220 L 0 160 Z"/>
    <path d="M 0 0 L 340 120 L 260 300 L 0 260 Z"/>
    <path d="M 0 0 L 460 160 L 360 380 L 0 380 Z"/>
    <line x1="0" y1="0" x2="220" y2="80"/>
    <line x1="0" y1="0" x2="340" y2="120"/>
    <line x1="0" y1="0" x2="460" y2="160"/>
    <line x1="0" y1="0" x2="160" y2="220"/>
    <line x1="0" y1="0" x2="260" y2="300"/>
    <circle cx="220" cy="80" r="3.5" fill="#FF1744"/>
    <circle cx="160" cy="220" r="3" fill="#FF2A4D"/>
    <circle cx="340" cy="120" r="3" fill="#FF1744"/>
    <circle cx="260" cy="300" r="3.5" fill="#FF2A4D"/>
    <circle cx="460" cy="160" r="2.5" fill="#FF1744"/>
  </g>

  <!-- Right Geometric Spider-Web Network (Cyan/Blue Tone) -->
  <g class="web-lines" stroke="#00D2FF" stroke-width="1.2" fill="none">
    <path d="M 1200 0 L 980 80 L 1040 220 L 1200 160 Z"/>
    <path d="M 1200 0 L 860 120 L 940 300 L 1200 260 Z"/>
    <path d="M 1200 0 L 740 160 L 840 380 L 1200 380 Z"/>
    <line x1="1200" y1="0" x2="980" y2="80"/>
    <line x1="1200" y1="0" x2="860" y2="120"/>
    <line x1="1200" y1="0" x2="740" y2="160"/>
    <line x1="1200" y1="0" x2="1040" y2="220"/>
    <line x1="1200" y1="0" x2="940" y2="300"/>
    <circle cx="980" cy="80" r="3.5" fill="#00D2FF"/>
    <circle cx="1040" cy="220" r="3" fill="#00E5FF"/>
    <circle cx="860" cy="120" r="3" fill="#00D2FF"/>
    <circle cx="940" cy="300" r="3.5" fill="#00E5FF"/>
    <circle cx="740" cy="160" r="2.5" fill="#00D2FF"/>
  </g>

  <!-- Modern Stylized Tech Spider Emblem (Center Top) -->
  <g class="spider-icon" transform="translate(600, 72) scale(0.85)">
    <!-- Spider Core Body -->
    <path d="M 0 -26 L 8 -12 L 5 4 L 0 10 L -5 4 L -8 -12 Z" fill="#FF1744" filter="url(#glowRed)"/>
    <path d="M 0 14 L 11 26 L 8 46 L 0 58 L -8 46 L -11 26 Z" fill="#FF1744" filter="url(#glowRed)"/>
    <circle cx="0" cy="4" r="3" fill="#00E5FF" filter="url(#glowSoft)"/>

    <!-- Left Spider Legs (Angular Cybernetic / Iron Spider Style) -->
    <!-- Top Left Leg -->
    <path d="M -6 -14 L -24 -36 L -52 -44 L -44 -26 L -20 -18" fill="none" stroke="#FF2A4D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Upper Mid Left Leg -->
    <path d="M -7 -6 L -32 -16 L -66 -16 L -56 -2 L -24 0" fill="none" stroke="#FF1744" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Lower Mid Left Leg -->
    <path d="M -7 20 L -30 26 L -62 44 L -48 54 L -18 36" fill="none" stroke="#00D2FF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Bottom Left Leg -->
    <path d="M -6 38 L -24 56 L -44 86 L -32 88 L -12 60" fill="none" stroke="#00E5FF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Right Spider Legs (Mirrored) -->
    <!-- Top Right Leg -->
    <path d="M 6 -14 L 24 -36 L 52 -44 L 44 -26 L 20 -18" fill="none" stroke="#FF2A4D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Upper Mid Right Leg -->
    <path d="M 7 -6 L 32 -16 L 66 -16 L 56 -2 L 24 0" fill="none" stroke="#FF1744" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Lower Mid Right Leg -->
    <path d="M 7 20 L 30 26 L 62 44 L 48 54 L 18 36" fill="none" stroke="#00D2FF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Bottom Right Leg -->
    <path d="M 6 38 L 24 56 L 44 86 L 32 88 L 12 60" fill="none" stroke="#00E5FF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Tagline Pill Badge -->
  <g transform="translate(600, 160)">
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#0b1323" stroke="url(#spiderGlow)" stroke-width="1.2" opacity="0.95"/>
    <circle cx="-168" cy="0" r="4" fill="#FF1744" filter="url(#glowRed)"/>
    <circle cx="168" cy="0" r="4" fill="#00E5FF" filter="url(#glowSoft)"/>
    <text x="0" y="4.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">YOUR FRIENDLY NEIGHBORHOOD DEV</text>
  </g>

  <!-- Main Headline Name -->
  <text x="600" y="228" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="3" text-anchor="middle" filter="drop-shadow(0px 4px 16px rgba(0,0,0,0.9))">
    AKBAR RESTU SETIAJI
  </text>

  <!-- Subtitle -->
  <text x="600" y="266" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', monospace" font-size="14.5" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    ERP &amp; SYSTEMS INTEGRATION SPECIALIST  <tspan fill="#FF2A4D">|</tspan>  ODOO DEVELOPER
  </text>

  <!-- Tech Badges Pills at Bottom -->
  <g transform="translate(600, 310)">
    <!-- Odoo -->
    <g transform="translate(-230, 0)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#140f1a" stroke="#A855F7" stroke-width="1.2"/>
      <text x="0" y="4" fill="#D8B4FE" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">ODOO</text>
    </g>
    <!-- Python -->
    <g transform="translate(-120, 0)">
      <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#0d1829" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="0" y="4" fill="#93C5FD" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">PYTHON</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(0, 0)">
      <rect x="-56" y="-12" width="112" height="24" rx="12" fill="#0b1b2b" stroke="#00D2FF" stroke-width="1.2"/>
      <text x="0" y="4" fill="#7DD3FC" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">POSTGRESQL</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(122, 0)">
      <rect x="-52" y="-12" width="104" height="24" rx="12" fill="#0c182b" stroke="#60A5FA" stroke-width="1.2"/>
      <text x="0" y="4" fill="#93C5FD" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">TYPESCRIPT</text>
    </g>
    <!-- Docker -->
    <g transform="translate(230, 0)">
      <rect x="-44" y="-12" width="88" height="24" rx="12" fill="#0a1a2b" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="0" y="4" fill="#BAE6FD" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">DOCKER</text>
    </g>
  </g>

  <!-- Glowing Top & Bottom Cyber Spider Accent Bars -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#spiderGlow)" stroke-width="3" filter="url(#glowSoft)"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="url(#spiderGlow)" stroke-width="3" filter="url(#glowSoft)"/>
</svg>
